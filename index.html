<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gorv</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Gorv: ventas, inventario y método AGI para tu negocio de gorras. Funciona sin internet.">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gorv">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <h1 id="title">Hoy</h1>
  <p id="subtitle"></p>
  <div class="hr"><span id="netBadge" class="badge off" hidden>Sin conexión</span></div>
</header>
<main id="view"></main>
<div id="ticket" hidden></div>
<nav aria-label="Secciones">
  <button data-t="hoy" onclick="go('hoy')"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 016 0v2"/></svg>Hoy</button>
  <button data-t="panel" onclick="go('panel')"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Panel</button>
  <button data-t="stock" onclick="go('stock')"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5V8zM3 8l9 5 9-5M12 13v8"/></svg>Inventario</button>
  <button data-t="ventas" onclick="go('ventas')"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3zM9 8h6M9 12h6"/></svg>Ventas</button>
  <button data-t="ajustes" onclick="go('ajustes')"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Ajustes</button>
</nav>
<div id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<script src="app.js"></script>
</body>
</html>
